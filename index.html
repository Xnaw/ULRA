<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ULRA Hall of Records</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--card:#121212;--ink:#f3ede0;--muted:#9c9482;--gold:#d4af37;--goldline:rgba(212,175,55,.45);--silver:#cfd3d9;--bronze:#d08a4e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:44px 16px 72px}
h1,h2,.name,.block,.cond{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}
header{text-align:center;margin:0 0 30px}
h1{margin:0;font-weight:700;font-size:clamp(54px,18vw,92px);line-height:.9;letter-spacing:.06em;color:var(--gold);padding-left:.06em}
.kicker{margin:10px 0 0;font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:600;font-size:16px;letter-spacing:.38em;text-transform:uppercase;color:var(--ink);padding-left:.38em}
.rule{height:1px;margin:22px auto 0;max-width:260px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.sub{color:var(--muted);font-size:14px;margin:12px 0 0}
#s{display:block;width:100%;font:inherit;font-size:16px;padding:12px 2px;border:0;border-bottom:1px solid var(--goldline);background:transparent;color:var(--ink);margin:0 0 26px;border-radius:0}
#s::placeholder{color:var(--muted)}
#s:focus{outline:0;border-bottom-color:var(--gold)}
.event{background:linear-gradient(180deg,#171512,var(--card) 60%);border:1px solid var(--goldline);border-top:2px solid var(--gold);border-radius:2px;padding:20px 16px 0;margin:0 0 18px;overflow:hidden}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 22px}
h2{margin:0;font-weight:700;font-size:24px;letter-spacing:.05em;text-transform:uppercase;line-height:1.15}
.date{font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:500;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:6px;align-items:end;margin:0 -16px}
.podium .slot:first-child{margin-left:16px}.podium .slot:last-child{margin-right:16px}
.slot{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.name{margin:0 0 6px;font-weight:600;font-size:19px;line-height:1.15;letter-spacing:.02em;overflow-wrap:anywhere}
.badge{font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:500;font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 12px;overflow-wrap:anywhere}
.badge:empty{display:none}
.p1 .badge{color:var(--gold)}.p2 .badge{color:var(--silver)}.p3 .badge{color:var(--bronze)}
.block{width:100%;display:flex;justify-content:center;padding-top:8px;font-weight:700;font-size:30px;line-height:1;color:#141008;border-radius:2px 2px 0 0}
.p1 .block{height:84px;background:linear-gradient(180deg,#ecd27a,#b98f26)}
.p2 .block{height:60px;background:linear-gradient(180deg,#e6e9ee,#98a0ab)}
.p3 .block{height:44px;background:linear-gradient(180deg,#dea06a,#9a5d2b)}
.foot,.empty{color:var(--muted);font-size:13px;text-align:center;letter-spacing:.04em}
@media (max-width:400px){.name{font-size:16px}.badge{font-size:11px;letter-spacing:.1em}h2{font-size:20px}.head{flex-direction:column;gap:2px}}
</style>
</head>
<body>
<main>
<header>
<h1>ULRA</h1>
<p class="kicker">Hall of Records</p>
<div class="rule"></div>
<p class="sub">Uma Love Racing Association</p>
</header>
<input id="s" type="search" placeholder="Search events or players" aria-label="Search events or players">
<div id="events"></div>
<p class="foot" id="count"></p>
</main>
<script>
var EVENTS=[];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function csv(t){
  var rows=[],r=[],f="",q=false,i,c;
  for(i=0;i<t.length;i++){c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;
    else if(c==","){r.push(f);f=""}
    else if(c=="\n"){r.push(f);rows.push(r);r=[];f=""}
    else if(c!="\r")f+=c;
  }
  if(f!==""||r.length){r.push(f);rows.push(r)}
  return rows;
}
function slot(c,r,n,b){return '<div class="slot '+c+'"><p class="name">'+esc(n)+'</p><span class="badge">'+esc(b)+'</span><div class="block">'+r+'</div></div>'}
function render(){
  var q=document.getElementById("s").value.toLowerCase(),h="";
  EVENTS.forEach(function(e){
    if(q&&e.all.indexOf(q)<0)return;
    h+='<section class="event"><div class="head"><h2>'+esc(e.n)+'</h2><span class="date">'+esc(e.d)+'</span></div><div class="podium">'+slot("p2",2,e.n2,e.b2)+slot("p1",1,e.n1,e.b1)+slot("p3",3,e.n3,e.b3)+'</div></section>';
  });
  document.getElementById("events").innerHTML=h||'<p class="empty">No events found.</p>';
  document.getElementById("count").textContent=EVENTS.length+" events on record";
}
function msg(t){document.getElementById("events").innerHTML='<p class="empty">'+t+'</p>'}
fetch("sheet-link.txt?"+Date.now()).then(function(r){return r.text()}).then(function(u){
  u=u.trim();
  if(u.indexOf("http")!==0){msg("Sheet link not added yet.");return}
  return fetch(u).then(function(r){return r.text()}).then(function(t){
    if(t.trim().charAt(0)==="<"){msg("That link is not the published CSV link.");return}
    var rows=csv(t).slice(1).filter(function(r){return r[0]&&r[0].trim()});
    EVENTS=rows.reverse().map(function(r){
      function g(k){return (r[k]||"").trim()}
      return {n:g(0),d:g(1),n1:g(2),b1:g(3),n2:g(4),b2:g(5),n3:g(6),b3:g(7),all:r.join(" ").toLowerCase()};
    });
    render();
  });
}).catch(function(){msg("Could not load the results sheet.")});
document.getElementById("s").addEventListener("input",render);
</script>
</body>
</html>
